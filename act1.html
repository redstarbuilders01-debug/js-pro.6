<html>
    <body>
        <h1>SUM IN ARGUMENTS</h1>
        <p>ARGUMENTS IS NOTHING BUT THE VALUES ASSIGNED TO THE PARAMETERS</p>
        <p id="result"></p>
        <script>
        // 1. Call function and store result in x
        let x = sumAll(1, 123, 500, 115, 44, 88);

        // 2. Display the result in the paragraph tag
        document.getElementById("result").innerHTML = "Sum is: " + x;

        function sumAll() {
          let sum = 0;
          for (let i = 0; i < arguments.length; i++) {
            sum += arguments[i];
          }
          return sum;
        }
        </script>
    </body>
</html>
